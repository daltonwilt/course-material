# For spring.profiles.active it will check the first profiles override properties
# that can be overridden. Then it will check the next profile continuing through

#spring.profiles.active=test,dev
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/demo_db
#    username:
#    password:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
